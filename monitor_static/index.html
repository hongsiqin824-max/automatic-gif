<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>足球比赛监控台</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MATCH MONITOR</p>
        <h1>足球比赛直播监控台</h1>
        <div class="topbar-row">
          <button id="enter-workshop-btn" class="button primary" type="button" disabled>进入工作台</button>
          <span id="list-summary" class="muted">正在读取进行中的比赛…</span>
          <span id="health" class="health loading"><i></i>连接中</span>
        </div>
      </div>
      <div id="topbar-actions" class="topbar-actions hidden">
        <span id="auth-user" class="muted"></span>
        <a id="auth-admin-link" class="button secondary hidden" href="admin/access">访问审批<span id="auth-pending-badge" class="pending-badge hidden"></span></a>
        <button id="auth-logout-btn" class="button ghost" type="button">退出</button>
      </div>
    </header>

    <!-- 工作台工具栏 -->
    <section id="workshop-toolbar" class="toolbar hidden">
      <button id="back-to-list-btn" class="button secondary" type="button">← 返回比赛列表</button>
      <button id="refresh-btn-2" class="button secondary" type="button">刷新</button>
      <span id="workshop-summary" class="muted"></span>
    </section>

    <div id="notice" class="notice hidden"></div>

    <!-- 比赛列表视图 -->
    <section id="list-view">
      <div class="list-search"><input id="list-search-input" class="list-search-input" type="search" placeholder="搜索球队、赛事或比赛 ID" autocomplete="off" aria-label="搜索比赛"></div>
      <div id="match-grid" class="match-grid"></div>
      <div id="list-empty" class="grid-empty hidden">当前没有进行中的比赛</div>
      <details id="finished-section" class="finished-section hidden">
        <summary id="finished-summary">已完赛待处理</summary>
        <div id="finished-grid" class="match-grid"></div>
      </details>
    </section>

    <!-- 工作台视图 -->
    <section id="workshop-view" class="hidden">
      <section id="grid" class="grid">
        <div id="grid-empty" class="grid-empty">正在加载当前进行中的比赛…</div>
      </section>
    </section>
  </main>

  <button id="alert-launcher" class="alert-launcher" type="button" aria-label="展开实时提醒">
    <span class="alert-launcher-ico">🔔</span>
    <span>实时提醒</span>
    <span id="alert-badge" class="alert-badge hidden">0</span>
  </button>

  <aside id="alert-panel" class="alert-panel hidden">
    <div class="alert-panel-head">
      <strong>实时提醒</strong>
      <span class="alert-panel-hint">进球 / 红牌</span>
      <button id="alert-close" class="alert-close" type="button" aria-label="收起">×</button>
    </div>
    <div id="alert-list" class="alert-list">
      <div class="alert-empty" id="alert-empty">暂无进球 / 红牌提醒</div>
    </div>
  </aside>

  <div id="toast-container" class="toast-container"></div>

  <div id="stage" class="stage hidden">
    <div class="stage-inner">
      <div class="stage-head">
        <strong id="stage-title">比赛</strong>
        <div class="stage-actions">
          <span id="stage-lag" class="lag-badge na" title="当前画面比服务器最新画面晚多少秒">落后 —</span>
          <button id="stage-live" class="button secondary" type="button">回到直播</button>
          <button id="stage-close" class="button ghost" type="button">关闭</button>
        </div>
      </div>
      <div class="stage-body">
        <div class="stage-left">
          <div id="stage-video-host" class="stage-video-host"></div>
          <div class="stage-range">
            <button id="stage-range-start" class="button secondary" type="button" title="把当前画面设为 GIF 起点（快捷键 S）">开始 <kbd>S</kbd></button>
            <button id="stage-range-end" class="button primary" type="button" disabled title="把当前画面设为终点并生成 GIF（快捷键 E；不发布，发布在右侧面板）">结束 <kbd>E</kbd></button>
            <span id="stage-range-state" class="stage-range-state hidden"></span>
            <span class="stage-range-hint muted">快捷键：S 起点 · E 终点并截取 · Enter 发布 · Esc 关闭</span>
          </div>
          <div id="stage-status" class="stage-status muted"></div>
          <div id="stage-notes" class="stage-notes"></div>
        </div>
        <div class="stage-right">
          <div class="stage-clips-head">本场已截取的 GIF <span id="stage-clips-count" class="stage-clips-count"></span></div>
          <div id="stage-clips" class="stage-clips"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="static/vendor/hls.min.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
